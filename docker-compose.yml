# Basis: Datenbank + API. Reverse-Proxy per Overlay (COMPOSE_FILE in .env):
#   Homelab:  docker-compose.yml:deploy/compose.traefik.yml   (DNS-01, nur LAN/VPN)
#   Oracle:   docker-compose.yml:deploy/compose.caddy.yml     (öffentlich, HTTP-01)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kochplan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      POSTGRES_DB: kochplan
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kochplan"]
      interval: 10s
      retries: 5

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kochplan:${POSTGRES_PASSWORD}@db:5432/kochplan
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
