# Öffentlicher Server (Oracle): Caddy mit automatischem Let's Encrypt (HTTP-01)
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN fehlt in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

volumes:
  caddy_data:
  caddy_config:
